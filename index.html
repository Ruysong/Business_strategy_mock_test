<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>J&J sqld 문제은행</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f3;
        --panel: #ffffff;
        --ink: #18201d;
        --muted: #66706a;
        --line: #dfe4da;
        --line-strong: #bcc7bb;
        --accent: #176f5f;
        --accent-soft: #dceee9;
        --warn: #a45b13;
        --bad: #b3261e;
        --good: #167247;
        --focus: #2f7de1;
        --shadow: 0 16px 40px rgba(25, 38, 31, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--line-strong);
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        min-height: 36px;
        padding: 7px 11px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(47, 125, 225, 0.22);
        outline-offset: 2px;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.ghost {
        border-color: transparent;
        background: transparent;
      }

      button.icon {
        width: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }

      button.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: #0b5145;
      }

      select,
      input[type="search"] {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line-strong);
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 9px;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 248, 243, 0.94);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--accent);
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .tabs {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .tabs button {
        border: 0;
        border-radius: 0;
        min-width: 118px;
      }

      .tabs button + button {
        border-left: 1px solid var(--line);
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 340px;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }

      aside,
      main {
        min-width: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .section {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: 0;
      }

      .section h2,
      .section h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .row.nowrap {
        flex-wrap: nowrap;
      }

      .field label {
        display: block;
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 26px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 9px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
      }

      .chapter-list {
        max-height: 44vh;
        overflow: auto;
        display: grid;
        gap: 6px;
        padding-right: 3px;
      }

      .chapter-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
      }

      .workspace {
        display: grid;
        gap: 14px;
      }

      .question {
        padding: 18px;
      }

      .q-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .q-title {
        display: grid;
        gap: 6px;
      }

      .q-title strong {
        font-size: 17px;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
      }

      .prompt {
        margin: 16px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .options {
        display: grid;
        gap: 8px;
      }

      .option {
        width: 100%;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        text-align: left;
        min-height: 44px;
        border-color: var(--line);
      }

      .option .badge {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #eef2ed;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .option.correct {
        border-color: rgba(22, 114, 71, 0.55);
        background: #edf8f1;
      }

      .option.correct .badge {
        background: var(--good);
        color: #fff;
      }

      .option.wrong {
        border-color: rgba(179, 38, 30, 0.48);
        background: #fff0ee;
      }

      .option.wrong .badge {
        background: var(--bad);
        color: #fff;
      }

      .answer-box {
        display: none;
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
        white-space: pre-wrap;
      }

      .answer-box.show {
        display: block;
      }

      .answer-line {
        color: var(--good);
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        background: #fbfcf8;
      }

      .starboard {
        position: sticky;
        top: 72px;
        max-height: calc(100vh - 88px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .star-list {
        overflow: auto;
        padding: 10px;
        display: grid;
        gap: 10px;
      }

      .mini-q {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }

      .mini-q strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .mini-q pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
        font: inherit;
        color: var(--muted);
      }

      .empty {
        padding: 22px;
        text-align: center;
        color: var(--muted);
      }

      .drop {
        border: 1px dashed var(--line-strong);
        background: #fbfcf8;
        border-radius: 8px;
        padding: 12px;
      }

      .drop.drag {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .hidden-file {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .exam-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
        gap: 6px;
      }

      .dot {
        min-width: 0;
        padding: 0;
        height: 34px;
      }

      .dot.answered {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .report {
        display: grid;
        gap: 12px;
      }

      .report-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        background: #fff;
      }

      .report-item.good {
        border-left: 5px solid var(--good);
      }

      .report-item.bad {
        border-left: 5px solid var(--bad);
      }

      .report-item pre {
        white-space: pre-wrap;
        font: inherit;
        margin: 8px 0 0;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 50;
        min-width: 220px;
        max-width: min(420px, calc(100vw - 32px));
        padding: 11px 13px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--shadow);
        color: var(--ink);
        transform: translateY(20px);
        opacity: 0;
        transition: 0.18s ease;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 260px minmax(0, 1fr);
        }

        .starboard {
          grid-column: 1 / -1;
          position: static;
          max-height: none;
        }
      }

      @media (max-width: 760px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .tabs {
          width: 100%;
        }

        .tabs button {
          min-width: 0;
        }

        .layout {
          grid-template-columns: 1fr;
          padding: 10px;
        }

        .q-head,
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .row.nowrap {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div>
            <h1>J&amp;J sqld 문제은행</h1>
            <div class="status" id="dataStatus">문제 데이터 대기 중</div>
          </div>
        </div>
        <div class="tabs" aria-label="mode">
          <button id="practiceTab" class="active" type="button">단원별 문풀</button>
          <button id="examTab" type="button">실제 기출 풀이</button>
        </div>
        <button class="primary" id="importTop" type="button">데이터 불러오기</button>
      </header>

      <div class="layout">
        <aside class="panel">
          <div class="section">
            <h2>문제 데이터</h2>
            <div class="stack">
              <div id="dropZone" class="drop">
                <div class="stack">
                  <div>로컬 JSON 또는 기존 단일 HTML을 불러와요.</div>
                  <button id="importButton" type="button">파일 선택</button>
                  <input id="fileInput" class="hidden-file" type="file" accept=".json,.html,text/html,application/json" />
                </div>
              </div>
              <div class="row">
                <button id="clearData" type="button">불러온 데이터 삭제</button>
              </div>
            </div>
          </div>

          <div class="section">
            <h2>필터</h2>
            <div class="stack">
              <div class="field">
                <label for="chapterSelect">단원</label>
                <select id="chapterSelect"></select>
              </div>
              <div class="field">
                <label for="sourceSelect">출처</label>
                <select id="sourceSelect"></select>
              </div>
              <div class="field">
                <label for="roundSelect">회차</label>
                <select id="roundSelect"></select>
              </div>
              <div class="row">
                <button id="randomToggle" type="button">랜덤</button>
                <button id="starOnlyToggle" type="button">별표만</button>
              </div>
            </div>
          </div>

          <div class="section">
            <h2>단원 바로가기</h2>
            <div class="chapter-list" id="chapterList"></div>
          </div>
        </aside>

        <main class="workspace">
          <section id="practiceView" class="panel"></section>
          <section id="examView" class="panel" hidden></section>
        </main>

        <aside class="panel starboard">
          <div class="section">
            <div class="row nowrap" style="justify-content: space-between">
              <h2 style="margin: 0">별표 모음</h2>
              <div class="row">
                <button id="copyStars" type="button">복사</button>
                <button id="clearStars" type="button">비우기</button>
              </div>
            </div>
          </div>
          <div class="star-list" id="starList"></div>
        </aside>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const DB_NAME = "jnj_sqld_bank";
      const DB_VERSION = 1;
      const STAR_KEY = "jnj_sqld_stars";
      const state = {
        mode: "practice",
        questions: [],
        filtered: [],
        index: 0,
        revealed: false,
        selected: null,
        random: false,
        starOnly: false,
        stars: new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]")),
        exam: {
          pool: [],
          index: 0,
          answers: {},
          finished: false,
        },
      };

      const $ = (id) => document.getElementById(id);
      const els = {
        dataStatus: $("dataStatus"),
        practiceTab: $("practiceTab"),
        examTab: $("examTab"),
        importTop: $("importTop"),
        importButton: $("importButton"),
        fileInput: $("fileInput"),
        dropZone: $("dropZone"),
        clearData: $("clearData"),
        chapterSelect: $("chapterSelect"),
        sourceSelect: $("sourceSelect"),
        roundSelect: $("roundSelect"),
        randomToggle: $("randomToggle"),
        starOnlyToggle: $("starOnlyToggle"),
        chapterList: $("chapterList"),
        practiceView: $("practiceView"),
        examView: $("examView"),
        starList: $("starList"),
        copyStars: $("copyStars"),
        clearStars: $("clearStars"),
        toast: $("toast"),
      };

      const circled = ["", "①", "②", "③", "④", "⑤", "⑥", "⑦"];

      function toast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1800);
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => req.result.createObjectStore("kv");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGet(key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("kv", "readonly");
          const req = tx.objectStore("kv").get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbSet(key, value) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("kv", "readwrite");
          tx.objectStore("kv").put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function idbDelete(key) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("kv", "readwrite");
          tx.objectStore("kv").delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      function normalize(raw, idx) {
        const q = raw || {};
        const options = Array.isArray(q.options)
          ? q.options.map((o, i) => ({
              no: Number(o.no || o.value || i + 1),
              text: String(o.text || o.label || o.content || o || "").trim(),
            }))
          : [];
        const source = String(q.source || q.provider || "local");
        const round = q.examRound || q.round || q.examNo || "";
        const no = q.questionNo || q.no || q.number || idx + 1;
        const id = String(q.id || q.questionId || `${source}-${round || "x"}-${no}-${idx}`);
        const chapter = String(q.autoChapter || q.chapter || q.subject || "미분류").trim() || "미분류";
        const answer = Number(q.correctOption || q.answer || q.correctNo || q.correct || 0);
        return {
          id,
          source,
          round,
          no,
          chapter,
          title: String(q.title || `Q${no}`),
          content: String(q.content || q.question || q.prompt || "").trim(),
          options,
          answer,
          answerText: String(q.correctOptionText || q.answerText || ""),
          explanation: String(q.explanation || q.commentary || q.reason || "").trim(),
          date: q.examDate || "",
        };
      }

      function parseFileText(text, filename) {
        if (/\.html?$/i.test(filename) || text.includes('id="question-data"')) {
          const marker = '<script id="question-data" type="application/json">';
          const start = text.indexOf(marker);
          if (start < 0) throw new Error("HTML 안에서 question-data를 찾지 못했어요.");
          const bodyStart = start + marker.length;
          const end = text.indexOf("<" + "/script>", bodyStart);
          if (end < 0) throw new Error("question-data script가 닫히지 않았어요.");
          return JSON.parse(text.slice(bodyStart, end));
        }
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed;
        if (Array.isArray(parsed.questions)) return parsed.questions;
        if (Array.isArray(parsed.data)) return parsed.data;
        throw new Error("문제 배열을 찾지 못했어요.");
      }

      async function importFile(file) {
        const text = await file.text();
        const parsed = parseFileText(text, file.name);
        const normalized = parsed.map(normalize).filter((q) => q.content && q.options.length);
        if (!normalized.length) throw new Error("가져올 수 있는 객관식 문항이 없어요.");
        state.questions = normalized;
        await idbSet("questions", normalized);
        state.index = 0;
        state.revealed = false;
        state.selected = null;
        hydrateFilters();
        render();
        toast(`${normalized.length.toLocaleString()}문항을 불러왔어요.`);
      }

      function saveStars() {
        localStorage.setItem(STAR_KEY, JSON.stringify([...state.stars]));
      }

      function uniq(values) {
        return [...new Set(values.filter((v) => v !== undefined && v !== null && String(v).trim() !== ""))];
      }

      function hydrateFilters() {
        const chapters = uniq(state.questions.map((q) => q.chapter)).sort((a, b) => a.localeCompare(b, "ko"));
        const sources = uniq(state.questions.map((q) => q.source)).sort();
        const rounds = uniq(state.questions.map((q) => q.round)).sort((a, b) => Number(b) - Number(a));
        fillSelect(els.chapterSelect, [["", "전체 단원"], ...chapters.map((v) => [v, v])]);
        fillSelect(els.sourceSelect, [["", "전체 출처"], ...sources.map((v) => [v, v])]);
        fillSelect(els.roundSelect, [["", "전체 회차"], ...rounds.map((v) => [v, `${v}회`])]);
        els.chapterList.innerHTML = chapters
          .map((chapter) => {
            const count = state.questions.filter((q) => q.chapter === chapter).length;
            return `<button class="chapter-item" data-chapter="${escapeAttr(chapter)}" type="button"><span>${escapeHtml(chapter)}</span><span class="pill">${count}</span></button>`;
          })
          .join("");
      }

      function fillSelect(select, entries) {
        const old = select.value;
        select.innerHTML = entries.map(([value, label]) => `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`).join("");
        if ([...select.options].some((o) => o.value === old)) select.value = old;
      }

      function applyFilters() {
        const chapter = els.chapterSelect.value;
        const source = els.sourceSelect.value;
        const round = els.roundSelect.value;
        let list = state.questions.filter((q) => {
          if (chapter && q.chapter !== chapter) return false;
          if (source && q.source !== source) return false;
          if (round && String(q.round) !== round) return false;
          if (state.starOnly && !state.stars.has(q.id)) return false;
          return true;
        });
        if (state.random) list = shuffle(list);
        state.filtered = list;
        if (state.index >= list.length) state.index = 0;
      }

      function shuffle(list) {
        const copy = [...list];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function render() {
        els.practiceTab.classList.toggle("active", state.mode === "practice");
        els.examTab.classList.toggle("active", state.mode === "exam");
        els.practiceView.hidden = state.mode !== "practice";
        els.examView.hidden = state.mode !== "exam";
        els.randomToggle.classList.toggle("active", state.random);
        els.starOnlyToggle.classList.toggle("active", state.starOnly);
        els.dataStatus.textContent = state.questions.length
          ? `${state.questions.length.toLocaleString()}문항 로드됨`
          : "문제 데이터 대기 중";
        applyFilters();
        renderPractice();
        renderExam();
        renderStars();
      }

      function renderPractice() {
        if (!state.questions.length) {
          els.practiceView.innerHTML = `<div class="empty">상단이나 왼쪽에서 로컬 문제 데이터를 불러오면 바로 시작됩니다.</div>`;
          return;
        }
        if (!state.filtered.length) {
          els.practiceView.innerHTML = `<div class="empty">현재 필터에 맞는 문항이 없어요.</div>`;
          return;
        }
        const q = state.filtered[state.index];
        els.practiceView.innerHTML = `
          <article class="question">
            <div class="q-head">
              <div class="q-title">
                <strong>${escapeHtml(q.title || `Q${q.no}`)}</strong>
                <div class="meta">${escapeHtml(q.chapter)} · ${escapeHtml(q.source)}${q.round ? ` · ${escapeHtml(q.round)}회` : ""} · ${state.index + 1}/${state.filtered.length}</div>
              </div>
              <div class="row">
                <button class="icon ${state.stars.has(q.id) ? "active" : ""}" id="starCurrent" type="button" title="별표">${state.stars.has(q.id) ? "★" : "☆"}</button>
                <button id="copyCurrent" type="button">복사</button>
              </div>
            </div>
            <div class="prompt">${escapeHtml(stripOptions(q.content, q.options))}</div>
            <div class="options">${q.options.map((o) => optionButton(q, o, state.selected, state.revealed)).join("")}</div>
            <div class="answer-box ${state.revealed ? "show" : ""}">
              <div class="answer-line">정답: ${circled[q.answer] || q.answer} ${escapeHtml(q.answerText || optionText(q, q.answer))}</div>
              ${q.explanation ? `<div>${escapeHtml(q.explanation)}</div>` : `<div>해설이 없는 문항입니다.</div>`}
            </div>
          </article>
          <div class="toolbar">
            <div class="row">
              <button id="prevQuestion" type="button">이전</button>
              <button id="nextQuestion" class="primary" type="button">다음</button>
              <button id="revealQuestion" type="button">정답 보기</button>
            </div>
            <div class="pill">별표 ${state.stars.size.toLocaleString()}</div>
          </div>
        `;
      }

      function optionButton(q, option, selected, revealed) {
        const isCorrect = Number(option.no) === Number(q.answer);
        const isSelected = Number(option.no) === Number(selected);
        const klass = revealed && isCorrect ? "correct" : revealed && isSelected && !isCorrect ? "wrong" : "";
        return `<button class="option ${klass}" data-option="${option.no}" type="button"><span class="badge">${circled[option.no] || option.no}</span><span>${escapeHtml(option.text)}</span></button>`;
      }

      function optionText(q, no) {
        return (q.options.find((o) => Number(o.no) === Number(no)) || {}).text || "";
      }

      function stripOptions(content, options) {
        let text = content;
        for (const o of options) {
          const label = circled[o.no] || `${o.no}.`;
          text = text.replace(`${label} ${o.text}`, "").replace(`${label}${o.text}`, "");
        }
        return text.trim();
      }

      function renderExam() {
        if (!state.questions.length) {
          els.examView.innerHTML = `<div class="empty">문제 데이터를 불러오면 기출 풀이 모드를 사용할 수 있습니다.</div>`;
          return;
        }
        if (!state.exam.pool.length) {
          els.examView.innerHTML = `
            <div class="section">
              <h2>실제 기출 풀이</h2>
              <div class="stack">
                <div class="row">
                  <button id="startExam" class="primary" type="button">현재 필터로 시험 시작</button>
                  <span class="pill">필터 결과 ${state.filtered.length.toLocaleString()}문항</span>
                </div>
              </div>
            </div>
          `;
          return;
        }
        if (state.exam.finished) {
          renderReport();
          return;
        }
        const q = state.exam.pool[state.exam.index];
        const selected = state.exam.answers[q.id];
        els.examView.innerHTML = `
          <article class="question">
            <div class="q-head">
              <div class="q-title">
                <strong>${escapeHtml(q.title || `Q${q.no}`)}</strong>
                <div class="meta">${escapeHtml(q.chapter)} · ${escapeHtml(q.source)}${q.round ? ` · ${escapeHtml(q.round)}회` : ""} · ${state.exam.index + 1}/${state.exam.pool.length}</div>
              </div>
              <button class="icon ${state.stars.has(q.id) ? "active" : ""}" id="starExam" type="button" title="별표">${state.stars.has(q.id) ? "★" : "☆"}</button>
            </div>
            <div class="prompt">${escapeHtml(stripOptions(q.content, q.options))}</div>
            <div class="options">${q.options.map((o) => optionButton(q, o, selected, false)).join("")}</div>
          </article>
          <div class="toolbar">
            <div class="row">
              <button id="prevExam" type="button">이전</button>
              <button id="nextExam" class="primary" type="button">다음</button>
              <button id="finishExam" type="button">채점</button>
            </div>
            <div class="pill">응답 ${Object.keys(state.exam.answers).length}/${state.exam.pool.length}</div>
          </div>
          <div class="section">
            <div class="exam-grid">${state.exam.pool
              .map((item, i) => `<button class="dot ${state.exam.answers[item.id] ? "answered" : ""}" data-jump="${i}" type="button">${i + 1}</button>`)
              .join("")}</div>
          </div>
        `;
      }

      function renderReport() {
        const total = state.exam.pool.length;
        const correct = state.exam.pool.filter((q) => Number(state.exam.answers[q.id]) === Number(q.answer)).length;
        els.examView.innerHTML = `
          <div class="section">
            <div class="row nowrap" style="justify-content: space-between">
              <h2 style="margin: 0">채점 결과 ${correct}/${total}</h2>
              <div class="row">
                <button id="copyReport" type="button">전체 복사</button>
                <button id="resetExam" class="primary" type="button">다시 풀기</button>
              </div>
            </div>
          </div>
          <div class="section report">
            ${state.exam.pool.map((q, i) => reportItem(q, i)).join("")}
          </div>
        `;
      }

      function reportItem(q, i) {
        const picked = state.exam.answers[q.id];
        const ok = Number(picked) === Number(q.answer);
        return `
          <div class="report-item ${ok ? "good" : "bad"}">
            <strong>${i + 1}. ${ok ? "정답" : "오답"} · ${escapeHtml(q.chapter)}</strong>
            <pre>${escapeHtml(stripOptions(q.content, q.options))}</pre>
            <pre>${escapeHtml(q.options.map((o) => `${circled[o.no] || o.no} ${o.text}`).join("\n"))}</pre>
            <pre>내 답: ${picked ? `${circled[picked] || picked} ${optionText(q, picked)}` : "미응답"}
정답: ${circled[q.answer] || q.answer} ${q.answerText || optionText(q, q.answer)}
${q.explanation || "해설 없음"}</pre>
          </div>
        `;
      }

      function renderStars() {
        const starred = state.questions.filter((q) => state.stars.has(q.id));
        if (!starred.length) {
          els.starList.innerHTML = `<div class="empty">별표한 문항이 여기에 쌓입니다.</div>`;
          return;
        }
        els.starList.innerHTML = starred
          .map(
            (q) => `<div class="mini-q">
              <strong>${escapeHtml(q.title)} · ${escapeHtml(q.chapter)}</strong>
              <div>${escapeHtml(stripOptions(q.content, q.options))}</div>
              <pre>${escapeHtml(q.options.map((o) => `${circled[o.no] || o.no} ${o.text}`).join("\n"))}</pre>
              <pre>정답: ${circled[q.answer] || q.answer} ${escapeHtml(q.answerText || optionText(q, q.answer))}
${escapeHtml(q.explanation || "해설 없음")}</pre>
            </div>`
          )
          .join("");
      }

      function plainQuestion(q) {
        return `${q.title} · ${q.chapter} · ${q.source}${q.round ? ` · ${q.round}회` : ""}

${stripOptions(q.content, q.options)}

${q.options.map((o) => `${circled[o.no] || o.no} ${o.text}`).join("\n")}

정답: ${circled[q.answer] || q.answer} ${q.answerText || optionText(q, q.answer)}
해설: ${q.explanation || "해설 없음"}`;
      }

      function reportText() {
        const total = state.exam.pool.length;
        const correct = state.exam.pool.filter((q) => Number(state.exam.answers[q.id]) === Number(q.answer)).length;
        return [`J&J sqld 문제은행 채점 결과: ${correct}/${total}`, "", ...state.exam.pool.map((q, i) => `${i + 1}. ${Number(state.exam.answers[q.id]) === Number(q.answer) ? "정답" : "오답"}\n${plainQuestion(q)}\n내 답: ${state.exam.answers[q.id] ? `${circled[state.exam.answers[q.id]] || state.exam.answers[q.id]} ${optionText(q, state.exam.answers[q.id])}` : "미응답"}`)].join("\n\n---\n\n");
      }

      async function copyText(text) {
        await navigator.clipboard.writeText(text);
        toast("복사했어요.");
      }

      function nextPractice(delta) {
        if (!state.filtered.length) return;
        state.index = (state.index + delta + state.filtered.length) % state.filtered.length;
        state.revealed = false;
        state.selected = null;
        render();
      }

      function toggleStar(id) {
        if (state.stars.has(id)) state.stars.delete(id);
        else state.stars.add(id);
        saveStars();
        render();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      document.addEventListener("click", async (event) => {
        const target = event.target.closest("button");
        if (!target) return;
        if (target.id === "practiceTab") state.mode = "practice";
        if (target.id === "examTab") state.mode = "exam";
        if (target.id === "importTop" || target.id === "importButton") els.fileInput.click();
        if (target.id === "clearData") {
          await idbDelete("questions");
          state.questions = [];
          state.exam = { pool: [], index: 0, answers: {}, finished: false };
          hydrateFilters();
        }
        if (target.id === "randomToggle") state.random = !state.random;
        if (target.id === "starOnlyToggle") state.starOnly = !state.starOnly;
        if (target.dataset.chapter) {
          els.chapterSelect.value = target.dataset.chapter;
          state.index = 0;
        }
        if (target.dataset.option) {
          if (state.mode === "practice") {
            state.selected = Number(target.dataset.option);
            state.revealed = true;
          } else {
            const q = state.exam.pool[state.exam.index];
            state.exam.answers[q.id] = Number(target.dataset.option);
          }
        }
        if (target.id === "prevQuestion") nextPractice(-1);
        if (target.id === "nextQuestion") nextPractice(1);
        if (target.id === "revealQuestion") state.revealed = true;
        if (target.id === "starCurrent" && state.filtered[state.index]) toggleStar(state.filtered[state.index].id);
        if (target.id === "copyCurrent" && state.filtered[state.index]) await copyText(plainQuestion(state.filtered[state.index]));
        if (target.id === "copyStars") await copyText(state.questions.filter((q) => state.stars.has(q.id)).map(plainQuestion).join("\n\n---\n\n"));
        if (target.id === "clearStars") {
          state.stars.clear();
          saveStars();
        }
        if (target.id === "startExam") {
          state.exam = { pool: [...state.filtered], index: 0, answers: {}, finished: false };
        }
        if (target.id === "prevExam") state.exam.index = Math.max(0, state.exam.index - 1);
        if (target.id === "nextExam") state.exam.index = Math.min(state.exam.pool.length - 1, state.exam.index + 1);
        if (target.id === "finishExam") state.exam.finished = true;
        if (target.id === "resetExam") state.exam = { pool: [], index: 0, answers: {}, finished: false };
        if (target.id === "starExam" && state.exam.pool[state.exam.index]) toggleStar(state.exam.pool[state.exam.index].id);
        if (target.dataset.jump) state.exam.index = Number(target.dataset.jump);
        if (target.id === "copyReport") await copyText(reportText());
        render();
      });

      for (const select of [els.chapterSelect, els.sourceSelect, els.roundSelect]) {
        select.addEventListener("change", () => {
          state.index = 0;
          state.revealed = false;
          state.selected = null;
          render();
        });
      }

      els.fileInput.addEventListener("change", async () => {
        const file = els.fileInput.files && els.fileInput.files[0];
        if (!file) return;
        try {
          await importFile(file);
        } catch (error) {
          toast(error.message || "불러오기에 실패했어요.");
        } finally {
          els.fileInput.value = "";
        }
      });

      for (const name of ["dragenter", "dragover"]) {
        els.dropZone.addEventListener(name, (event) => {
          event.preventDefault();
          els.dropZone.classList.add("drag");
        });
      }

      for (const name of ["dragleave", "drop"]) {
        els.dropZone.addEventListener(name, (event) => {
          event.preventDefault();
          els.dropZone.classList.remove("drag");
        });
      }

      els.dropZone.addEventListener("drop", async (event) => {
        const file = event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) return;
        try {
          await importFile(file);
        } catch (error) {
          toast(error.message || "불러오기에 실패했어요.");
        }
      });

      async function init() {
        state.questions = (await idbGet("questions")) || [];
        hydrateFilters();
        render();
      }

      init().catch((error) => {
        console.error(error);
        toast("초기화 중 오류가 났어요.");
        render();
      });
    </script>
  </body>
</html>
